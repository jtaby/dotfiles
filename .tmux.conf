# Make prefix easier (Ctrl+a instead of Ctrl+b)
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# Faster escape from tmux commands
set -sg escape-time 10

# Mouse support (scroll, resize panes)
set -g mouse on

# Easier pane splitting
bind | split-window -h
bind - split-window -v

bind r source-file ~/.tmux.conf \; display "reloaded"

# Neutral borders
set -g pane-border-style fg=colour238
set -g pane-active-border-style fg=colour238

# Change background color to make active pane more obvious
set -g focus-events on
set-hook -g pane-focus-out 'select-pane -P bg=colour0,fg=colour10'
set-hook -g pane-focus-in 'select-pane -P bg=default,fg=default'
